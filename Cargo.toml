[package]
name = "system-lifecycle-extension"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cross-platform OS lifecycle detection and sync coordination for Python"
authors = ["System Lifecycle Contributors"]

[lib]
name = "system_lifecycle"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
parking_lot = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
futures-util = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_System_SystemServices",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSObject"] }
libc = "0.2"

[dev-dependencies]
pyo3 = { version = "0.23", features = ["auto-initialize"] }

[features]
default = []
mock-platform = []

[profile.release]
lto = true
codegen-units = 1
